directories:
  output: dist
  buildResources: build
appId: com.juggleknobs.artisansledger
productName: Artisan's Ledger
files:
  - filter:
      - main.js
      - app/**/*
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.games
linux:
  target: AppImage
  icon: build/icon.png
  category: Game
electronVersion: 31.7.7
